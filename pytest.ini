[pytest]
asyncio_mode = auto
# Без явного значения pytest-asyncio при каждом запуске печатает предупреждение
# об устаревании. "function" — то, к чему он сам идёт по умолчанию.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Корень репозитория в sys.path: `python -m pytest` кладёт туда текущий каталог сам,
# а голый `pytest` из активированного окружения — нет, и падал бы на import helper.
pythonpath = .
# Плагин anyio приезжает вместе с httpx и starlette, но асинхронные тесты ведёт
# pytest-asyncio, а anyio на pytest 9 при загрузке печатает PytestRemovedIn10Warning
# про переименованный CallSpec2. Ему здесь нечего вести, поэтому не грузим.
addopts = -p no:anyio
