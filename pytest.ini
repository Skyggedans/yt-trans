[pytest]
asyncio_mode = auto
# Without an explicit value pytest-asyncio prints a deprecation warning
# on every run. "function" is what it defaults to anyway.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Repository root in sys.path: `python -m pytest` puts the current directory there itself,
# but a bare `pytest` from an activated environment does not, and would fail on import helper.
pythonpath = .
# The anyio plugin comes with httpx and starlette, but async tests are driven by
# pytest-asyncio, and anyio on pytest 9 prints PytestRemovedIn10Warning at load
# about the renamed CallSpec2. It has nothing to drive here, so we do not load it.
addopts = -p no:anyio
