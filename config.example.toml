# Пример конфигурации демона. Скопировать в ~/.config/yt-trans/config.toml
# и отредактировать. Без файла берутся значения, показанные ниже как умолчания.
#
# Читается один раз при старте: смена модели требует перезапуска демона. Это
# намеренно — модель резидентна в ollama, и менять её посреди задания значит
# переоткрывать всю дисциплину свопа видеопамяти.

[asr]
# Распознавание. Замеры на FLEURS sr_rs: large-v3 даёт WER 11.4%,
# large-v3-turbo 11.8% при вдвое большей скорости, но на реальном ролике
# turbo однажды недосчитался 7 пунктов покрытия — потерял кусок речи.
# Задержка упирается в перевод, а не в распознавание, поэтому экономить
# здесь нечего и по умолчанию стоит large-v3.
model = "large-v3"

# int8_float16 экономит около гигабайта, но НЕ ускоряет: замерено 19.6 с
# против 19.2 у float16 на одном и том же клипе. Брать его стоит только
# если памяти не хватает.
compute_type = "float16"

# Язык речи. "auto" — язык определяет сам демон: определитель слушает окна
# по всей длине ролика и работает всегда, а метка языка от YouTube для него
# лишь подсказка (сербские каналы YouTube бывает помечает английскими).
#
# Код языка ("sr", "en", "ru"…) закрепляет язык для КАЖДОГО ролика: Whisper
# распознаёт с ним, даже если звучит другой язык, а определитель только
# отмечает расхождение. Ставить, лишь если все ролики на одном языке.
# sh, me и cnr годятся и означают sr; регион и письменность отбрасываются
# ("sr-Latn" — это sr). Код, которого Whisper не знает, — ошибка в журнале
# при старте и отказ каждого нового ролика: «неизвестный язык …».
language = "auto"

# Расход видеопамяти. Обычно не нужен: для известных сочетаний модели
# и типа вычислений он берётся из справочника в helper/config.py.
# Задавать обязательно, если ставишь модель, которой там нет — иначе
# контроль допуска не сможет решить, помещается ли она на карту.
# vram_mib = 6144


[translator]
# Любая модель из `ollama list`. Требование одно: она должна помещаться
# на карту рядом с десктопом. На 24 ГБ это примерно до 18 ГБ.
#
# Замеры на RTX 4090: qwen3.8:27b держится целиком в видеопамяти и выдаёт
# 98–130 токенов в секунду, тогда как gemma4:31b не помещается, сползает
# на процессор и падает до 15 — при том же качестве русского.
model = "qwen3.8:27b"

# Более лёгкая замена, если карта нужна под другое. Осторожно: по
# человеческой оценке качества перевода на сербском 12B проигрывает 27B
# почти вдвое — это куда более резкий обрыв, чем на других языках.
# model = "translategemma:12b"

# vram_mib = 17800


[youtube]
# Отдельный аккаунт YouTube для роликов 18+. Без него такие ролики не
# переводятся: YouTube отдаёт их только вошедшему пользователю. Всё остальное
# демон качает анонимно, а аккаунт подставляет, только когда YouTube отказал
# именно возрастным ограничением.
#
# Аккаунт нужен отдельный, не основной. Так советует сам yt-dlp: аккаунт,
# через который он ходит, YouTube может забанить, временно или навсегда
# (https://github.com/yt-dlp/yt-dlp/wiki/Extractors#exporting-youtube-cookies).
# Возраст у аккаунта должен быть подтверждён: проверить можно, открыв под ним
# любой ролик 18+ в браузере.
#
# Выгружать cookies так, чтобы браузер их потом не перевыпустил и тем не
# обесценил — открытые вкладки YouTube обновляет регулярно:
#   1. Открыть приватное окно и войти в этот аккаунт на youtube.com.
#   2. В той же вкладке открыть https://www.youtube.com/robots.txt; других
#      приватных вкладок быть не должно.
#   3. Выгрузить cookies youtube.com в файл формата Netscape расширением,
#      которому разрешено работать в приватном режиме (подходящие перечислены
#      в FAQ yt-dlp, «How do I pass cookies to yt-dlp?»).
#   4. Закрыть приватное окно.
#   5. chmod 600 на файл: в нём вход в аккаунт.
#
# yt-dlp при каждом вызове дописывает в файл обновлённые cookies, поэтому
# файл должен быть доступен демону на запись. Настройка читается при старте:
# после правки — systemctl --user restart yt-trans. После замены устаревшего
# файла тоже: отказ по ролику, уже полученный, держится до перезапуска.
# cookies = "~/.config/yt-trans/youtube-18.txt"

[server]
# На каком адресе слушает демон. По умолчанию только петля: демон запускает
# запросы к YouTube по команде клиента, и открывать его в сеть просто так нельзя.
# Планшет в другой комнате требует "0.0.0.0". Тогда демон доступен всем в своей
# сети: токена у него нет, и чужие страницы в браузере отсекает только проверка
# Origin. Любой, кто дотянется до порта, будет им пользоваться.
# host = "0.0.0.0"

# HTTPS. Нужен не ради шифрования домашней сети, а ради планшета: браузер
# считает безопасным только https, а без этого страницу не поставить как
# приложение — и тогда Android не покажет её в share-диалоге, то есть
# «Поделиться» из YouTube не сработает.
#
# Сертификат выпускает packaging/make-tls.sh: свой корневой CA плюс сертификат
# на адреса этой машины. ca.crt из того же каталога один раз ставится на
# планшет. Без обоих файлов демон работает по http, как раньше.
#
# С сертификатом демон слушает ТОЛЬКО https: расширение на компьютере тоже
# переключается на https (протокол в его настройках), а ca.crt нужен и его
# браузеру — иначе запрос падает на недоверии к сертификату.
# tls_cert = "~/.config/yt-trans/tls/server.crt"
# tls_key = "~/.config/yt-trans/tls/server.key"

[video]
# Куда складывать готовые mp4 для страницы планшета. По умолчанию — общий кэш
# проекта (~/.cache/yt-trans/video). Каталог можно увести, например, в /tmp:
# там файлы живут в оперативной памяти, SSD не пишется вовсе, но после
# перезагрузки кэш пуст и первый просмотр качает ролик заново.
# dir = "/tmp/yt-trans-video"

# Потолок кэша в гибибайтах: при переполнении удаляются самые давние ролики,
# кроме последнего скачанного. Двадцать — это про диск (примерно пятьдесят
# часовых роликов в 1080p). В /tmp (tmpfs) столько занимать нельзя: там это
# оперативная память, и потолок ставят по запасу памяти — четыре гигабайта
# хватает примерно на десять роликов по 26 минут.
# max_gib = 20
