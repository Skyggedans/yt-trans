<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>yt-trans — субтитры на планшете</title>
<!-- Манифест делает страницу устанавливаемым приложением: имя, экран запуска,
     иконки и share_target — то, по чему Android открывает нас из «Поделиться».
     В share-диалог пускают только установленные приложения, поэтому одной
     ссылки в манифесте мало — страницу надо поставить на главный экран. -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">

  <section id="home">
    <form id="link-form">
      <input id="link-url" type="url" inputmode="url" autocomplete="off"
        placeholder="Ссылка на ролик или плейлист YouTube">
      <button type="submit">Добавить</button>
    </form>

    <!-- Поиск по сохранённым: список растёт, и найти в нём нужный ролик
         прокруткой со временем становится дольше, чем набрать пару букв.
         Пока ссылок нет, поле спрятано. -->
    <input id="links-filter" type="search" autocomplete="off" hidden
      placeholder="Поиск по названию">

    <!-- Прокручивается только эта часть: поле ссылки и поиск выше остаются
         на экране, сколько бы ссылок ни накопилось. -->
    <div id="library">
      <ul id="links"></ul>
    </div>
  </section>

  <section id="stage" hidden>
    <!-- controls обязательны: браузер не даёт запустить звук вне нажатия, и
         автозапуск после ответа демона отклоняется молча. Со своими кнопками
         зритель в любом случае может начать, встать на паузу и перемотать.
         controlslist убирает родную кнопку «во весь экран»: она разворачивает
         только ролик, а строки — соседний слой, и в этом режиме их не видно.
         Вместо неё — своя кнопка, которая разворачивает всю сцену. -->
    <video id="video" controls controlslist="nofullscreen" playsinline preload="metadata"></video>
    <div id="overlay"></div>
    <!-- Выключатели строк: планшет смотрят и без русского перевода, когда
         важнее черногорский текст, и без черногорского — когда нужен только
         перевод. Рядом — размер строк: с другого конца комнаты обычный мелковат,
         а вплотную к экрану крупный мешает. -->
    <div id="lines">
      <button id="toggle-target" type="button" aria-pressed="true"
        aria-label="русский перевод" title="русский перевод">RU</button>
      <button id="toggle-study" type="button" aria-pressed="true"
        aria-label="черногорская строка" title="черногорская строка">CNR</button>
      <select id="font-size" aria-label="размер субтитров" title="размер субтитров">
        <option value="tiny">очень мелкий</option>
        <option value="small">мелкий</option>
        <option value="normal" selected>обычный</option>
        <option value="large">крупный</option>
      </select>
    </div>
    <!-- Слева сверху: возврат к списку, ⛶ и кеш. Все три — про весь кадр, а не
         про строки, которые идут справа. Стрелка первая: уход со сцены — самое
         частое действие, а браузерной кнопки «назад» на планшете не найти.
         «Кеш» по умолчанию выключен: без нажатия на устройстве не оседает
         ничего. Иконки рисует app.js — страница не тянет их из сети.
         Статус и название стоят в этой же полосе, а не поверх кадра: там
         они спорили с субтитрами. Название — посередине, одной строкой. -->
    <div id="stage-bar">
      <button id="back" type="button" aria-label="к списку" title="к списку"
        data-icon="back"></button>
      <button id="fullscreen" type="button" aria-label="во весь экран"
        title="во весь экран">⛶</button>
      <button id="cache" type="button" aria-pressed="false"
        aria-label="копировать ролик на устройство"
        title="копировать ролик на устройство"></button>
      <div id="status" role="status"></div>
      <div id="title"></div>
    </div>
  </section>

</div>

<script type="module" src="/app.js"></script>
</body>
</html>
