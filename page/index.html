<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>yt-trans — subtitles on the tablet</title>
<!-- The manifest makes the page an installable app: a name, a launch screen,
     icons and a share_target — what Android opens us from "Share" by. Only
     installed apps are allowed into the share dialog, so a link in the
     manifest is not enough — the page must be added to the home screen. -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">

  <section id="home">
    <form id="link-form">
      <input id="link-url" type="url" inputmode="url" autocomplete="off"
        placeholder="Link to a YouTube video or playlist">
      <button type="submit">Add</button>
    </form>

    <!-- Search across saved ones: the list grows, and finding the right video
         by scrolling eventually takes longer than typing a couple of letters.
         While there are no links, the field is hidden. -->
    <input id="links-filter" type="search" autocomplete="off" hidden
      placeholder="Search by title">

    <!-- Only this part scrolls: the link field and search above stay on
         screen no matter how many links accumulate. -->
    <div id="library">
      <ul id="links"></ul>
    </div>
  </section>

  <section id="stage" hidden>
    <!-- controls are mandatory: the browser does not allow starting sound
         outside a press, and autoplay after the daemon's answer is rejected
         silently. With its own buttons the viewer can in any case start,
         pause and seek. controlslist removes the native "fullscreen" button:
         it expands only the video, while the lines are a neighbouring layer,
         and in that mode they are not visible. Instead there is our own
         button, which expands the whole stage. -->
    <video id="video" controls controlslist="nofullscreen" playsinline preload="metadata"></video>
    <div id="overlay"></div>
    <!-- Line switches: the tablet is watched also without the Russian
         translation, when the Montenegrin text matters more, and without the
         Montenegrin one — when only the translation is needed. Next to them —
         the line size: from the far end of the room the usual one is a bit
         small, and up close to the screen the large one gets in the way. -->
    <div id="lines">
      <button id="toggle-target" type="button" aria-pressed="true"
        aria-label="Russian translation" title="Russian translation">RU</button>
      <button id="toggle-study" type="button" aria-pressed="true"
        aria-label="Montenegrin line" title="Montenegrin line">CNR</button>
      <select id="font-size" aria-label="subtitle size" title="subtitle size">
        <option value="tiny">very small</option>
        <option value="small">small</option>
        <option value="normal" selected>normal</option>
        <option value="large">large</option>
      </select>
    </div>
    <!-- The bar, left to right: the way back and the title attached to it, then
         everything about the whole frame on the right. The arrow comes first —
         leaving the stage is the most frequent action, and the browser's "back"
         button is not to be found on a tablet. "Cache" is off by default:
         without a press nothing settles on the device. The icons are drawn by
         app.js — the page does not pull them from the network.
         The status and the title stand in this same bar rather than over the
         frame: there they argued with the subtitles. The status sits left of
         the two buttons, so their place does not move with the length of a
         message, and the title takes the rest of the left. -->
    <div id="stage-bar">
      <button id="back" type="button" aria-label="to the list" title="to the list"
        data-icon="back"></button>
      <div id="title"></div>
      <div id="stage-actions">
        <div id="status" role="status"></div>
        <button id="fullscreen" type="button" aria-label="fullscreen"
          title="fullscreen">⛶</button>
        <button id="cache" type="button" aria-pressed="false"
          aria-label="copy the video to the device"
          title="copy the video to the device"></button>
      </div>
    </div>
  </section>

</div>

<script type="module" src="/app.js"></script>
</body>
</html>
